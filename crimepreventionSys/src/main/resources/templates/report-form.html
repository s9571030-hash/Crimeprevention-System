<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Submit Report</title>
</head>
<body class="bg-dark text-white">
<div class="container mt-5">
    <div class="col-md-6 offset-md-3 bg-white text-dark p-4 rounded shadow">
        <h3>🚨 Report Suspicious Activity</h3>
        <p class="text-muted">Help your community stay safe by reporting incidents early.</p>
        <hr>
        <form th:action="@{/reports/save}" th:object="${report}" method="post">
            <div class="mb-3">
                <label>Incident Title</label>
                <input type="text" th:field="*{title}" class="form-control" placeholder="e.g. Unusual loitering near park" required>
            </div>
            <div class="mb-3">
                <label>Category</label>
                <select th:field="*{category}" class="form-select">
                    <option value="Theft">Theft</option>
                    <option value="Vandalism">Vandalism</option>
                    <option value="Suspicious Activity">Suspicious Activity</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Area/Location</label>
                <input type="text" th:field="*{area}" class="form-control" placeholder="Street name or landmark" required>
            </div>
            <div class="mb-3">
                <label>Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-danger w-100">Submit Alert</button>
            <a th:href="@{/reports}" class="btn btn-link w-100 text-secondary mt-2">Cancel</a>
        </form>
    </div>
</div>
</body>
</html>
